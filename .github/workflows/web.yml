name: Web (PWA en mind.sesolibre.com)

# Publica la versión web (PWA instalable, funciona sin conexión) en GitHub
# Pages, con el dominio de public/CNAME, en cada push a main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nada se publica si fallan el lint o las pruebas.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: test -f dist/CNAME && cat dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
